services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    user: "node"
    read_only: true 
    tmpfs:
      - /tmp
    command: npm run start:prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NODE_ENV=production
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env

  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SERVER_API_URL=/api
    restart: unless-stopped
    user: "node"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    depends_on:
      - server
    environment:
      - NODE_ENV=production
    env_file: ./client/.env

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - internal
    depends_on:
      - client
      - server

networks:
  internal:
    driver: bridge

volumes:
  db-data: